name: Build platform binaries

# Matrix build for darwin-arm64 / linux-{x64,arm64} / win32-{x64,arm64}.
# Each runner builds for its own platform (no cross-compilation) so the
# bundler and the bundled `libopentui` native lib are always in sync.
# The arm64 runners (ubuntu-24.04-arm / windows-11-arm) are free for
# public repos; windows-11-arm needs Bun >= 1.3.10 and setup-bun >=
# 2.1.3 to get the native aarch64 toolchain.

on:
  # Manual trigger from the Actions tab; pick any branch.
  workflow_dispatch:
  push:
    # Auto-run on the debug branch and on version tags.
    branches: ['ci-debug']
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Let all three runners finish even if one fails so a single run
      # gives the complete cross-platform picture.
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
            exe: swarmflow
          - os: ubuntu-latest
            target: linux-x64
            exe: swarmflow
          - os: ubuntu-24.04-arm
            target: linux-arm64
            exe: swarmflow
          - os: windows-latest
            target: win32-x64
            exe: swarmflow.exe
          - os: windows-11-arm
            target: win32-arm64
            exe: swarmflow.exe
    runs-on: ${{ matrix.os }}
    name: build ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      # Pinned past 2.1.3: the floating v2 tag predates the native
      # bun-windows-aarch64 download logic that windows-11-arm needs.
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build single-file binary
        run: bun run build

      - name: List build output
        shell: bash
        run: ls -la build/

      # host == target, so the freshly built binary runs right here.
      # Catches "compiles but won't start" regressions (bad native lib,
      # broken bootstrap) before they reach a release.
      - name: Smoke test binary
        shell: bash
        run: ./build/${{ matrix.exe }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: swarmflow-${{ matrix.target }}
          path: build/swarmflow-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    # Only when a tag was pushed (intentional release). Collects the
    # three matrix artifacts and publishes a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Need the working tree so we can read CHANGELOG.md.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          for f in swarmflow-*.tar.gz; do
            shasum -a 256 "$f" > "$f.sha256"
          done
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Extract this tag's section from CHANGELOG.md. The heading
          # must match the tag literally (e.g. `## v0.3.2-alpha.1`).
          # Fail loud if missing — we never publish a release without
          # hand-written notes.
          awk -v t="## $tag" '$0==t{f=1;next} /^## /{f=0} f' CHANGELOG.md > NOTES.md
          if ! [ -s NOTES.md ]; then
            echo "release: CHANGELOG.md has no entry for $tag" >&2
            exit 1
          fi
          # Pre-release tags (-alpha/-beta/-rc) skip "latest" so
          # they don't displace stable installs.
          prerelease_flag=""
          case "$tag" in
            *-alpha*|*-beta*|*-rc*) prerelease_flag="--prerelease" ;;
          esac
          gh release create "$tag" \
            artifacts/swarmflow-* \
            --title "$tag" \
            --notes-file NOTES.md \
            $prerelease_flag
